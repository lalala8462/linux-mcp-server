[mcp_servers.linux-centos-ro]
command = "wsl.exe"
# Replace <wsl-user> with the local WSL account that installed linux-mcp-server.
args = ["-d", "Ubuntu", "--", "/home/<wsl-user>/.local/bin/linux-mcp-server"]
startup_timeout_sec = 30
tool_timeout_sec = 60
required = false
default_tools_approval_mode = "writes"
enabled = true
enabled_tools = [
  "get_system_information",
  "get_cpu_information",
  "get_memory_information",
  "get_disk_usage",
  "get_hardware_information",
  "list_services",
  "get_service_status",
  "get_service_logs",
  "list_processes",
  "get_process_info",
  "get_network_interfaces",
  "get_network_connections",
  "get_listening_ports",
  "get_journal_logs",
  "read_log_file",
  "list_block_devices",
  "list_directories",
  "list_files",
  "read_file",
]

[mcp_servers.linux-centos-ro.env]
# wsl.exe imports these Windows-side MCP variables only when WSLENV names them.
WSLENV = "LINUX_MCP_TOOLSET:LINUX_MCP_USER:LINUX_MCP_SSH_KEY_PATH:LINUX_MCP_VERIFY_HOST_KEYS:LINUX_MCP_KNOWN_HOSTS_PATH:LINUX_MCP_HOST_REGISTRY_PATH:LINUX_MCP_REQUIRE_MANAGED_HOST:LINUX_MCP_ALLOWED_ROOTS:LINUX_MCP_MAX_FILE_READ_BYTES:LINUX_MCP_COMMAND_TIMEOUT:LINUX_MCP_LOG_LEVEL:LITELLM_LOCAL_MODEL_COST_MAP"
LINUX_MCP_TOOLSET = "fixed"
LINUX_MCP_USER = "codex-ro"
# Managed profiles override these legacy single-host paths per alias.
LINUX_MCP_SSH_KEY_PATH = "/home/<wsl-user>/.local/share/linux-mcp-server/ssh/id_ed25519"
LINUX_MCP_VERIFY_HOST_KEYS = "true"
LINUX_MCP_KNOWN_HOSTS_PATH = "/home/<wsl-user>/.local/share/linux-mcp-server/ssh/known_hosts"
LINUX_MCP_HOST_REGISTRY_PATH = "/home/<wsl-user>/.local/share/linux-mcp-server/hosts"
LINUX_MCP_REQUIRE_MANAGED_HOST = "true"
LINUX_MCP_ALLOWED_ROOTS = "/opt/your-project"
LINUX_MCP_MAX_FILE_READ_BYTES = "1048576"
LINUX_MCP_COMMAND_TIMEOUT = "30"
LINUX_MCP_LOG_LEVEL = "INFO"
LITELLM_LOCAL_MODEL_COST_MAP = "true"
